<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Solar Service</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
    if (sessionStorage.getItem("adminLoggedIn") !== "true") {
        window.location.href = "admin-login.html";
    }
</script>

    <div class="app">

        <div class="logo">
            ☀️ Solar Service Admin
        </div>

        <p class="subtitle">
            Manage Customer Service Requests
        </p>


        <!-- =========================
             DASHBOARD
        ========================== -->

        <div class="dashboard">

            <div class="dashboard-box">
                <div class="dashboard-number" id="totalBookings">0</div>
                <div>📋 Total</div>
            </div>

            <div class="dashboard-box">
                <div class="dashboard-number" id="pendingBookings">0</div>
                <div>🟡 Pending</div>
            </div>

            <div class="dashboard-box">
                <div class="dashboard-number" id="confirmedBookings">0</div>
                <div>🔵 Confirmed</div>
            </div>

            <div class="dashboard-box">
                <div class="dashboard-number" id="completedBookings">0</div>
                <div>🟢 Completed</div>
            </div>

            <div class="dashboard-box">
                <div class="dashboard-number" id="cancelledBookings">0</div>
                <div>🔴 Cancelled</div>
            </div>

        </div>


        <!-- =========================
             ALL BOOKINGS
        ========================== -->

        <div class="card">

            <h2>📋 All Bookings</h2>
            <div style="margin-bottom: 20px;">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search customer or phone..."
        oninput="filterBookings()"
    >

    <select
        id="statusFilter"
        onchange="filterBookings()"
        style="margin-top: 10px;"
    >

        <option value="All">
            📋 All Status
        </option>

        <option value="Pending">
            🟡 Pending
        </option>

        <option value="Confirmed">
            🔵 Confirmed
        </option>

        <option value="Completed">
            🟢 Completed
        </option>

        <option value="Cancelled">
            🔴 Cancelled
        </option>

    </select>

</div>

            <div id="bookings">
                Loading bookings...
            </div>

            <br>

            <button onclick="window.location.href='index.html'">
    🏠 Back to Home
</button>

<button
    type="button"
    onclick="adminLogout()"
    style="background:#dc3545; color:white; margin-top:10px;"
>
    🔒 Logout
</button>

        </div>

    </div>


    <script>


        // ==========================================
        // LOAD ALL BOOKINGS
        // ==========================================
// =========================
// ADMIN LOGIN CHECK
// =========================

if (sessionStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href = "admin-login.html";

}
        async function loadBookings() {

            try {

                const response =
                    await fetch("/api/bookings");

                const bookings =
                    await response.json();


                // ==========================================
                // DASHBOARD COUNTS
                // ==========================================

                let pending = 0;
                let confirmed = 0;
                let completed = 0;
                let cancelled = 0;


                bookings.forEach(booking => {

                    if (booking.status === "Pending") {
                        pending++;
                    }

                    if (booking.status === "Confirmed") {
                        confirmed++;
                    }

                    if (booking.status === "Completed") {
                        completed++;
                    }

                    if (booking.status === "Cancelled") {
                        cancelled++;
                    }

                });


                document.getElementById("totalBookings").innerText =
                    bookings.length;

                document.getElementById("pendingBookings").innerText =
                    pending;

                document.getElementById("confirmedBookings").innerText =
                    confirmed;

                document.getElementById("completedBookings").innerText =
                    completed;

                document.getElementById("cancelledBookings").innerText =
                    cancelled;


                // ==========================================
                // BOOKINGS CONTAINER
                // ==========================================

                const container =
                    document.getElementById("bookings");


                if (bookings.length === 0) {

                    container.innerHTML =
                        "<p>No bookings found.</p>";

                    return;

                }


                container.innerHTML = "";


                // ==========================================
                // EACH BOOKING
                // ==========================================

                bookings.forEach(booking => {

                    const div =
                        document.createElement("div");


                    div.style.background = "#ffffff";
                    div.style.padding = "15px";
                    div.style.marginBottom = "15px";
                    div.style.borderRadius = "10px";
     div.dataset.name =
    (booking.name || "").toLowerCase();

div.dataset.phone =
    (booking.phone || "").toLowerCase();

div.dataset.status =
    booking.status || "Pending";

                    div.innerHTML = `

                        <strong>
                            👤 ${booking.name}
                        </strong>

                        <p>
                            📞 ${booking.phone}
                            <div style="margin-top:10px;">

    <a
        href="tel:${booking.phone}"
        style="
            display:inline-block;
            padding:10px 15px;
            background:#1f8f45;
            color:white;
            text-decoration:none;
            border-radius:8px;
            margin-right:8px;
        "
    >
        📞 Call
    </a>


    <a
    href="https://wa.me/91${booking.phone}?text=${encodeURIComponent(
        `☀️ Hello ${booking.name},

Your Solar Service booking has been updated.

🆔 Booking ID: ${booking.bookingId || "N/A"}
🔧 Service: ${booking.service}
📌 Status: ${booking.status || "Pending"}

${
    booking.appointmentDate && booking.appointmentTime
    ? `📅 Date: ${booking.appointmentDate}
🕐 Time: ${booking.appointmentTime}`
    : `📅 Appointment: Not scheduled yet`
}

Thank you for choosing Solar Service! ☀️`
    )}"
    target="_blank"
    style="
        display:inline-block;
        padding:10px 15px;
        background:#25D366;
        color:white;
        text-decoration:none;
        border-radius:8px;
    "
>
    💬 WhatsApp
</a>

</div>
                        </p>

                        <p>
                            🔧 ${booking.service}
                        </p>

                        <p>
                            📍 ${booking.address}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${booking.status || "Pending"}
                        </p>
                        ${booking.serviceDate ? `
    <p>
        📅 <strong>Service Date:</strong>
        ${booking.serviceDate}
    </p>

    <p>
        🕐 <strong>Service Time:</strong>
        ${booking.serviceTime}
    </p>
` : `
    <p>
        📅 <strong>Appointment:</strong>
        Not scheduled yet
    </p>
`}


                        <!-- STATUS -->

                        <label>
                            Change Status:
                        </label>

                        <select
                            onchange="updateStatus(
                                '${booking._id}',
                                this.value
                            )"
                        >

                            <option value="Pending"
                                ${booking.status === "Pending" ? "selected" : ""}>
                                Pending
                            </option>

                            <option value="Confirmed"
                                ${booking.status === "Confirmed" ? "selected" : ""}>
                                Confirmed
                            </option>

                            <option value="Completed"
                                ${booking.status === "Completed" ? "selected" : ""}>
                                Completed
                            </option>

                            <option value="Cancelled"
                                ${booking.status === "Cancelled" ? "selected" : ""}>
                                Cancelled
                            </option>

                        </select>


                        <!-- =================================
                             APPOINTMENT SECTION
                        ================================== -->

                        <hr style="margin:20px 0;">


                        <h3>
                            📅 Service Appointment
                        </h3>


                        <label>
                            Service Date:
                        </label>


                        <input
                            type="date"
                            id="date-${booking._id}"
                            value="${booking.appointmentDate || ""}"
                        >


                        <label>
                            Service Time:
                        </label>


                        <input
                            type="time"
                            id="time-${booking._id}"
                            value="${booking.appointmentTime || ""}"
                        >


                        <button
                            onclick="saveAppointment('${booking._id}')"
                        >
                            📅 Save Appointment
                        </button>
<button
    onclick="deleteBooking('${booking._id}')"
    style="background:#dc3545; color:white; margin-top:10px;"
>
    🗑️ Delete Booking
</button>
                    `;


                    container.appendChild(div);

                });

            }


            catch (error) {

                console.error(error);

                document.getElementById("bookings").innerHTML =
                    "<p>Unable to load bookings.</p>";

            }

        }



        // ==========================================
        // UPDATE STATUS
        // ==========================================
        // ===============================
// SEARCH + STATUS FILTER
// ===============================

// ===============================
// SEARCH + STATUS FILTER
// ===============================

function filterBookings() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    const selectedStatus =
        document
            .getElementById("statusFilter")
            .value;


    const cards =
        document
            .getElementById("bookings")
            .children;


    for (let card of cards) {

        const cardName =
            card.dataset.name || "";

        const cardPhone =
            card.dataset.phone || "";

        const cardStatus =
            card.dataset.status || "";


        const matchesSearch =
            cardName.includes(search) ||
            cardPhone.includes(search);


        const matchesStatus =
            selectedStatus === "All" ||
            cardStatus === selectedStatus;


        if (
            matchesSearch &&
            matchesStatus
        ) {

            card.style.display = "";

        } else {

            card.style.display = "none";

        }

    }

}
// ===============================
// DELETE BOOKING
// ===============================

async function deleteBooking(id) {

    const confirmDelete =
        confirm(
            "⚠️ Are you sure you want to delete this booking?"
        );

    if (!confirmDelete) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/bookings/${id}`,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (data.success) {

            alert(
                "🗑️ Booking deleted successfully!"
            );

            loadBookings();

        } else {

            alert(
                "❌ " + data.message
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "❌ Server connection problem."
        );

    }

}
        async function updateStatus(id, status) {

            try {

                const response =
                    await fetch(
                        `/api/bookings/${id}/status`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                status: status
                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "✅ Booking status updated!"
                    );

                    loadBookings();

                }

                else {

                    alert(
                        "❌ " + data.message
                    );

                }

            }


            catch (error) {

                console.error(error);

                alert(
                    "❌ Server connection problem."
                );

            }

        }



        // ==========================================
        // SAVE APPOINTMENT
        // ==========================================

        async function saveAppointment(id) {

            const date =
                document.getElementById(
                    `date-${id}`
                ).value;


            const time =
                document.getElementById(
                    `time-${id}`
                ).value;


            if (!date || !time) {

                alert(
                    "⚠️ Please select date and time."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/bookings/${id}/appointment`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                appointmentDate: date,

                                appointmentTime: time

                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "✅ Service appointment saved!"
                    );

                    loadBookings();

                }

                else {

                    alert(
                        "❌ " + data.message
                    );

                }

            }


            catch (error) {

                console.error(error);

                alert(
                    "❌ Server connection problem."
                );

            }

        }



        // ==========================================
        // LOAD BOOKINGS WHEN PAGE OPENS
        // ==========================================

        loadBookings();
function adminLogout() {

    sessionStorage.removeItem("adminLoggedIn");

    window.location.href = "admin-login.html";

}

</script>

<div class="card" style="margin-top:25px;">

    <h2>⭐ Customer Reviews</h2>

    <div id="reviewsContainer">
        <p>Loading reviews...</p>
    </div>

</div>


<script>

async function loadReviews() {

    const container =
        document.getElementById("reviewsContainer");

    try {

        const response =
            await fetch("/api/admin/reviews");

        const data =
            await response.json();

        if (!data.success) {

            container.innerHTML =
                "<p>❌ Reviews load nahi ho paaye.</p>";

            return;
        }

        if (!data.reviews.length) {

            container.innerHTML =
                "<p>⭐ Abhi koi review nahi hai.</p>";

            return;
        }

        container.innerHTML = "";

        data.reviews.forEach(review => {

            const div =
                document.createElement("div");

            div.style.cssText = `
                background:#f4faf5;
                padding:18px;
                margin:12px 0;
                border-radius:12px;
                border:1px solid #ddd;
            `;

            const stars =
                "⭐".repeat(review.rating);

            const status =
                review.approved
                    ? "🟢 Approved"
                    : "🟠 Pending";

            div.innerHTML = `

                <h3 style="margin:0 0 8px;">
                    ${review.customerName}
                </h3>

                <div style="font-size:20px;">
                    ${stars}
                </div>

                <p style="margin:8px 0;">
                    ${review.comment || "No written feedback"}
                </p>

                <p>
                    <strong>Booking:</strong>
                    ${review.bookingId}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${status}
                </p>

                ${
                    review.approved

                    ?

                    `<button
                        onclick="updateReview('${review._id}', false)"
                        style="
                            background:#d9534f;
                            color:white;
                            border:0;
                            padding:10px 16px;
                            border-radius:8px;
                            cursor:pointer;
                        "
                    >
                        Hide Review
                    </button>`

                    :

                    `<button
                        onclick="updateReview('${review._id}', true)"
                        style="
                            background:#219653;
                            color:white;
                            border:0;
                            padding:10px 16px;
                            border-radius:8px;
                            cursor:pointer;
                        "
                    >
                        ✅ Approve Review
                    </button>`
                }

            `;

            container.appendChild(div);

        });

    }

    catch(error) {

        console.log(error);

        container.innerHTML =
            "<p>❌ Server connection error.</p>";

    }

}


async function updateReview(id, approved) {

    try {

        const response =
            await fetch(
                `/api/admin/reviews/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        approved: approved
                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            alert(
                approved
                    ? "⭐ Review approved!"
                    : "Review hidden."
            );

            loadReviews();

        } else {

            alert(
                "❌ " + data.message
            );

        }

    }

    catch(error) {

        console.log(error);

        alert(
            "❌ Review update nahi ho paaya."
        );

    }

}


// Load reviews when Admin Panel opens
loadReviews();
// ================= PRODUCT ORDERS =================

async function loadProductOrders() {

    const existing = document.getElementById("productOrdersSection");

    if (existing) {
        existing.remove();
    }

    const section = document.createElement("div");

    section.id = "productOrdersSection";

    section.style.cssText = `
        margin:25px 0;
        padding:20px;
        background:#ffffff;
        border-radius:16px;
        box-shadow:0 4px 15px rgba(0,0,0,0.08);
    `;

    section.innerHTML = `
        <h2 style="
            color:#1255c5;
            margin-bottom:18px;
        ">
            📦 Product Orders
        </h2>

        <div id="productOrdersContainer">
            <p style="color:#777;">
                Loading product orders...
            </p>
        </div>
    `;

    document.querySelector(".app").appendChild(section);

    const container =
        document.getElementById("productOrdersContainer");

    try {

        const response = await fetch("/api/product-orders");

        const data = await response.json();

        if (!data.success || !data.orders || data.orders.length === 0) {

            container.innerHTML = `
                <div style="
                    padding:20px;
                    text-align:center;
                    background:#f5f8ff;
                    border-radius:12px;
                    color:#666;
                ">
                    📦 No product orders yet.
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        data.orders.forEach(order => {

            const card = document.createElement("div");

            card.style.cssText = `
                padding:18px;
                margin-bottom:15px;
                border:1px solid #e5e5e5;
                border-radius:12px;
                background:#fafafa;
            `;

            card.innerHTML = `

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:12px;
                ">

                    <strong>
                        Order #${order.orderId || order._id || "N/A"}
                    </strong>

                    <span style="
                        background:#e7f8ed;
                        color:#159447;
                        padding:6px 12px;
                        border-radius:20px;
                        font-size:13px;
                    ">
                        ${order.status || "Confirmed"}
                    </span>

                </div>

                <p>
                    📦 <strong>Product:</strong>
                    ${order.productName || "Solar Product"}
                </p>

                <p>
                    👤 <strong>Customer:</strong>
                   ${order.customer?.name || order.customerName || "N/A"}
                </p>

                <p>
                    📞 <strong>Mobile:</strong>
                    ${order.customer?.mobile || order.mobile || "N/A"}
                </p>

                <p>
                    💰 <strong>Amount:</strong>
                    ₹${order.totalAmount || order.amount || "0"}
                </p>

                <p>
                    💳 <strong>Payment:</strong>
                    ${order.paymentMethod || "Online"}
                </p>

                <button
                    onclick="updateProductOrderStatus('${order._id || order.orderId}', 'Packed')"
                    style="
                        background:#1255c5;
                        color:white;
                        border:0;
                        padding:10px 16px;
                        border-radius:8px;
                        cursor:pointer;
                        margin-top:8px;
                    "
                >
                    📦 Mark Packed
                </button>

                <button
                    onclick="updateProductOrderStatus('${order._id || order.orderId}', 'Shipped')"
                    style="
                        background:#f59e0b;
                        color:white;
                        border:0;
                        padding:10px 16px;
                        border-radius:8px;
                        cursor:pointer;
                        margin-top:8px;
                    "
                >
                    🚚 Mark Shipped
                </button>

                <button
                    onclick="updateProductOrderStatus('${order._id || order.orderId}', 'Delivered')"
                    style="
                        background:#159447;
                        color:white;
                        border:0;
                        padding:10px 16px;
                        border-radius:8px;
                        cursor:pointer;
                        margin-top:8px;
                    "
                >
                    ✅ Delivered
                </button>

            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.log(error);

        container.innerHTML = `
            <div style="
                padding:18px;
                background:#fff4f4;
                border-radius:12px;
                color:#c62828;
            ">
                ❌ Product orders could not be loaded.
            </div>
        `;
    }
}


// UPDATE PRODUCT ORDER STATUS

async function updateProductOrderStatus(orderId, status) {

    try {

        const response = await fetch(
            "/api/orders/" + orderId + "/status",
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                "✅ Order status updated to " + status
            );

            loadProductOrders();

        } else {

            alert(
                "❌ " +
                (data.message || "Status update failed")
            );
        }

    } catch (error) {

        console.log(error);

        alert(
            "❌ Server error while updating order."
        );
    }
}


// LOAD PRODUCT ORDERS

loadProductOrders();
</script>
</body>
