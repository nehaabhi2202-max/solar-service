<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Solar Service</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="logo">
            ☀️ Solar Service
        </div>

        <p class="subtitle">
            Admin Login
        </p>

        <div class="card">

            <h2>🔐 Admin Login</h2>

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
            >

            <button onclick="adminLogin()">
                🔓 Login
            </button>

        </div>

    </div>


    <script>

        function adminLogin() {

            const password =
                document.getElementById("password").value;

            if (password === "solar123") {

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                window.location.href =
                    "admin.html";

            }

            else {

                alert("❌ Wrong password");

            }

        }

    </script>

</body>

</html>
