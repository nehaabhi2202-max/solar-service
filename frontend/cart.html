<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | Solar Service</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            max-width: 520px;
            margin: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            background: white;
            border: 1px solid #e5ebe7;
            border-radius: 12px;
        }

        .cart-image {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            background: #f1f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin: 0 0 6px;
            font-size: 15px;
        }

        .cart-price {
            font-weight: bold;
            color: #0757c9;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: 1px solid #0757c9;
            background: white;
            color: #0757c9;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .remove-btn {
            margin-top: 8px;
            border: none;
            background: #fff0f0;
            color: #c62828;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary {
            margin-top: 20px;
            padding: 18px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e5ebe7;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .grand-total {
            font-size: 20px;
            font-weight: bold;
            color: #0757c9;
            border-top: 1px solid #ddd;
            padding-top: 12px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #0757c9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }
    </style>
</head>


<body>

<div class="app">

    <div class="cart-page">

        <div class="logo">
            ☀️ Solar Service
        </div>

        <p class="subtitle">
            🛒 My Cart
        </p>


        <div id="cartContainer"></div>


        <button
            onclick="window.location.href='index.html'"
            style="
                width:100%;
                padding:12px;
                margin-top:12px;
                border:1px solid #0757c9;
                background:white;
                color:#0757c9;
                border-radius:9px;
                font-weight:bold;
                cursor:pointer;
            ">

            🏠 Continue Shopping

        </button>

    </div>

</div>


<script>

const cartKey = "solarCart";


const oldProduct =
    localStorage.getItem("solarCartProduct");


function loadCart() {

    let cart =
        JSON.parse(
            localStorage.getItem(cartKey) || "[]"
        );


    // Convert existing Loom product
    // into new cart system once

    if (
        cart.length === 0 &&
        oldProduct
    ) {

        const product =
            JSON.parse(oldProduct);

        cart = [{
            name: product.name,
            price: Number(product.price),
            quantity: Number(product.quantity) || 1,
            icon: "☀️"
        }];

        localStorage.setItem(
            cartKey,
            JSON.stringify(cart)
        );
    }


    const container =
        document.getElementById("cartContainer");


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>🛒 Your cart is empty</h2>

                <p>
                    Add some solar products to continue.
                </p>

            </div>

        `;

        return;
    }


    let html = "";

    let total = 0;


    cart.forEach((item, index) => {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        html += `

            <div class="cart-item">

                <div class="cart-image">
                    ${item.icon || "☀️"}
                </div>


                <div class="cart-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="cart-price">
                        ₹${price.toLocaleString("en-IN")}
                    </div>


                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)">
                            −
                        </button>

                        <strong>
                            ${quantity}
                        </strong>

                        <button
                            onclick="changeQuantity(${index}, 1)">
                            +
                        </button>

                    </div>


                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        🗑 Remove

                    </button>

                </div>

            </div>

        `;

    });


    html += `

        <div class="summary">

            <div class="summary-row">

                <span>
                    Items
                </span>

                <span>
                    ${cart.length}
                </span>

            </div>


            <div class="summary-row grand-total">

                <span>
                    Total
                </span>

                <span>
                    ₹${total.toLocaleString("en-IN")}
                </span>

            </div>


            <button
                class="checkout-btn"
                onclick="goToCheckout()">

                Proceed to Checkout →

            </button>

        </div>

    `;


    container.innerHTML = html;
}


function changeQuantity(index, change) {

    const cart =
        JSON.parse(
            localStorage.getItem(cartKey) || "[]"
        );


    cart[index].quantity =
        (Number(cart[index].quantity) || 1)
        + change;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    localStorage.setItem(
        cartKey,
        JSON.stringify(cart)
    );


    loadCart();
}


function removeItem(index) {

    const cart =
        JSON.parse(
            localStorage.getItem(cartKey) || "[]"
        );


    cart.splice(index, 1);


    localStorage.setItem(
        cartKey,
        JSON.stringify(cart)
    );


    loadCart();
}


function goToCheckout() {

    const cart =
        JSON.parse(
            localStorage.getItem(cartKey) || "[]"
        );


    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;
    }


    window.location.href =
        "checkout.html";
}


loadCart();

</script>

</body>

</html>
