<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Account | Solar Service</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 12px;
            border: 1px solid #0755c9;
            border-radius: 8px;
            background: white;
            color: #0755c9;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-tabs button.active {
            background: #0755c9;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e7f8ed;
            color: #16823b;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">
        ☀️ Solar Service
    </div>

    <p class="subtitle">
        Customer Account
    </p>

    <div class="card">

        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="active"
                onclick="showLogin()">

                🔐 Login

            </button>

            <button
                id="signupTab"
                onclick="showSignup()">

                📝 Sign Up

            </button>

        </div>


        <!-- LOGIN -->

        <div id="loginForm" class="auth-form active">

            <h2>📱 Customer Login</h2>

            <p>
                Enter your registered mobile number.
            </p>

            <input
                type="tel"
                id="loginPhone"
                placeholder="10-digit mobile number"
                maxlength="10">

            <button onclick="loginCustomer()">
                🔐 Login
            </button>

        </div>


        <!-- SIGN UP -->

        <div id="signupForm" class="auth-form">

            <h2>📝 Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Full Name">

            <input
                type="tel"
                id="signupPhone"
                placeholder="10-digit mobile number"
                maxlength="10">

            <button onclick="signupCustomer()">
                📝 Create Account
            </button>

        </div>


        <!-- MESSAGE -->

        <div id="message"
             class="message">
        </div>


        <br>

        <button
            onclick="window.location.href='index.html'">

            🏠 Back to Home

        </button>

    </div>

</div>


<script>

function showLogin() {

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("signupForm")
        .classList.remove("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    clearMessage();
}


function showSignup() {

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("loginForm")
        .classList.remove("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    clearMessage();
}


function showMessage(message, type) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        "message " + type;
}


function clearMessage() {

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";
}


async function signupCustomer() {

    const name =
        document
            .getElementById("signupName")
            .value
            .trim();

    const phone =
        document
            .getElementById("signupPhone")
            .value
            .trim();


    if (!name) {

        showMessage(
            "Please enter your name.",
            "error"
        );

        return;
    }


    if (!/^[0-9]{10}$/.test(phone)) {

        showMessage(
            "Please enter a valid 10-digit mobile number.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch("/api/customers/signup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    phone: phone
                })

            });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message || "Signup failed.",
                "error"
            );

            return;
        }


        localStorage.setItem(
            "customerPhone",
            phone
        );


        showMessage(
            "✅ Account created successfully!",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "my-services.html";

        }, 700);


    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please try again.",
            "error"
        );

    }

}


async function loginCustomer() {

    const phone =
        document
            .getElementById("loginPhone")
            .value
            .trim();


    if (!/^[0-9]{10}$/.test(phone)) {

        showMessage(
            "Please enter a valid 10-digit mobile number.",
            "error"
        );

        return;
    }


    try {

        const response =
    await fetch("/api/customers/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            phone: phone
        })

    });


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message || "Account not found.",
                "error"
            );

            return;
        }


        localStorage.setItem(
            "customerPhone",
            phone
        );


        showMessage(
            "✅ Login successful!",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "my-services.html";

        }, 500);


    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please try again.",
            "error"
        );

    }

}

</script>

</body>

</html>
