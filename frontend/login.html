<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Account | Solar Care</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 12px;
            border: 1px solid #0755c9;
            border-radius: 8px;
            background: white;
            color: #0755c9;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-tabs button.active {
            background: #0755c9;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0755c9;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .secondary-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #0755c9;
            border-radius: 8px;
            background: white;
            color: #0755c9;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        #otpSection {
            display: none;
            margin-top: 20px;
        }

        #recaptcha-container {
            margin: 15px 0;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e7f8ed;
            color: #16823b;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        .timer {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">
        ☀️ Solar Care
    </div>

    <p class="subtitle">
        Customer Account
    </p>

    <div class="card">

        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="active"
                onclick="showLogin()">

                🔐 Login

            </button>

            <button
                id="signupTab"
                onclick="showSignup()">

                📝 Sign Up

            </button>

        </div>


        <!-- LOGIN -->

        <div id="loginForm" class="auth-form active">

            <h2>📱 Customer Login</h2>

            <p>
                Enter your mobile number to receive OTP.
            </p>

            <input
                type="tel"
                id="loginPhone"
                placeholder="10-digit mobile number"
                maxlength="10">

            <div id="recaptcha-login"></div>

            <button
                id="sendLoginOtpBtn"
                class="primary-btn"
                onclick="sendLoginOTP()">

                📲 Send OTP

            </button>

            <div id="loginOtpSection" style="display:none; margin-top:20px;">

                <input
                    type="tel"
                    id="loginOtp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6">

                <button
                    class="primary-btn"
                    onclick="verifyLoginOTP()">

                    ✅ Verify OTP

                </button>

                <div id="loginTimer" class="timer"></div>

            </div>

        </div>


        <!-- SIGN UP -->

        <div id="signupForm" class="auth-form">

            <h2>📝 Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Full Name">

            <input
                type="tel"
                id="signupPhone"
                placeholder="10-digit mobile number"
                maxlength="10">

            <div id="recaptcha-signup"></div>

            <button
                id="sendSignupOtpBtn"
                class="primary-btn"
                onclick="sendSignupOTP()">

                📲 Send OTP

            </button>

            <div id="signupOtpSection" style="display:none; margin-top:20px;">

                <input
                    type="tel"
                    id="signupOtp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6">

                <button
                    class="primary-btn"
                    onclick="verifySignupOTP()">

                    ✅ Verify & Create Account

                </button>

                <div id="signupTimer" class="timer"></div>

            </div>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>

        <br>

        <button
            class="secondary-btn"
            onclick="window.location.href='index.html'">

            🏠 Back to Home

        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        RecaptchaVerifier,
        signInWithPhoneNumber
    }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // YOUR FIREBASE CONFIG

    const firebaseConfig = {

        apiKey: "AIzaSyCy_YiJRk18HVzfSFb7yGBYWy2LMjJppLI",

        authDomain:
            "solar-service-dd68d.firebaseapp.com",

        projectId:
            "solar-service-dd68d",

        storageBucket:
            "solar-service-dd68d.firebasestorage.app",

        messagingSenderId:
            "815369742562",

        appId:
            "1:815369742562:web:50b10a955e5dc0868556bb",

        measurementId:
            "G-XMVYT4PQSV"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    let loginConfirmationResult = null;
    let signupConfirmationResult = null;

    let loginRecaptcha = null;
    let signupRecaptcha = null;


    // =========================
    // MESSAGE
    // =========================

    window.showMessage = function(message, type) {

        const box =
            document.getElementById("message");

        box.textContent = message;

        box.className =
            "message " + type;

    };


    window.clearMessage = function() {

        const box =
            document.getElementById("message");

        box.textContent = "";

        box.className = "message";

    };


    // =========================
    // TABS
    // =========================

    window.showLogin = function() {

        document
            .getElementById("loginForm")
            .classList.add("active");

        document
            .getElementById("signupForm")
            .classList.remove("active");

        document
            .getElementById("loginTab")
            .classList.add("active");

        document
            .getElementById("signupTab")
            .classList.remove("active");

        clearMessage();

    };


    window.showSignup = function() {

        document
            .getElementById("signupForm")
            .classList.add("active");

        document
            .getElementById("loginForm")
            .classList.remove("active");

        document
            .getElementById("signupTab")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.remove("active");

        clearMessage();

    };


    // =========================
    // LOGIN OTP
    // =========================

    window.sendLoginOTP = async function() {

        const phone =
            document
                .getElementById("loginPhone")
                .value
                .trim();


        if (!/^[0-9]{10}$/.test(phone)) {

            showMessage(
                "Please enter a valid 10-digit mobile number.",
                "error"
            );

            return;

        }


        try {

            if (!loginRecaptcha) {

                loginRecaptcha =
                    new RecaptchaVerifier(
                        auth,
                        "recaptcha-login",
                        {
                            size: "normal"
                        }
                    );

            }


            const fullPhone =
                "+91" + phone;


            loginConfirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    fullPhone,
                    loginRecaptcha
                );


            document
                .getElementById("loginOtpSection")
                .style.display = "block";


            showMessage(
                "✅ OTP sent to your mobile number.",
                "success"
            );


            startTimer(
                "loginTimer"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "OTP send failed: " +
                error.message,
                "error"
            );

        }

    };


    // =========================
    // VERIFY LOGIN OTP
    // =========================

    window.verifyLoginOTP = async function() {

        const otp =
            document
                .getElementById("loginOtp")
                .value
                .trim();


        if (!/^[0-9]{6}$/.test(otp)) {

            showMessage(
                "Please enter the 6-digit OTP.",
                "error"
            );

            return;

        }


        if (!loginConfirmationResult) {

            showMessage(
                "Please request OTP first.",
                "error"
            );

            return;

        }


        try {

            const result =
                await loginConfirmationResult.confirm(otp);


            const user =
                result.user;


            const phone =
                user.phoneNumber.replace("+91", "");


            // Check customer in MongoDB

            const response =
                await fetch(
                    "/api/customers/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            phone: phone
                        })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                showMessage(
                    data.message ||
                    "Account not found. Please Sign Up first.",
                    "error"
                );

                return;

            }


            localStorage.setItem(
                "customerPhone",
                phone
            );


            localStorage.setItem(
                "firebaseUid",
                user.uid
            );


            showMessage(
                "✅ OTP verified. Login successful!",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "my-services.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Invalid OTP. Please try again.",
                "error"
            );

        }

    };


    // =========================
    // SIGNUP OTP
    // =========================

    window.sendSignupOTP = async function() {

        const name =
            document
                .getElementById("signupName")
                .value
                .trim();

        const phone =
            document
                .getElementById("signupPhone")
                .value
                .trim();


        if (!name) {

            showMessage(
                "Please enter your name.",
                "error"
            );

            return;

        }


        if (!/^[0-9]{10}$/.test(phone)) {

            showMessage(
                "Please enter a valid 10-digit mobile number.",
                "error"
            );

            return;

        }


        try {

            if (!signupRecaptcha) {

                signupRecaptcha =
                    new RecaptchaVerifier(
                        auth,
                        "recaptcha-signup",
                        {
                            size: "normal"
                        }
                    );

            }


            const fullPhone =
                "+91" + phone;


            signupConfirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    fullPhone,
                    signupRecaptcha
                );


            document
                .getElementById("signupOtpSection")
                .style.display = "block";


            showMessage(
                "✅ OTP sent to your mobile number.",
                "success"
            );


            startTimer(
                "signupTimer"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "OTP send failed: " +
                error.message,
                "error"
            );

        }

    };


    // =========================
    // VERIFY SIGNUP OTP
    // =========================

    window.verifySignupOTP = async function() {

        const otp =
            document
                .getElementById("signupOtp")
                .value
                .trim();


        if (!/^[0-9]{6}$/.test(otp)) {

            showMessage(
                "Please enter the 6-digit OTP.",
                "error"
            );

            return;

        }


        try {

            const result =
                await signupConfirmationResult.confirm(otp);


            const user =
                result.user;


            const phone =
                user.phoneNumber.replace("+91", "");


            const name =
                document
                    .getElementById("signupName")
                    .value
                    .trim();


            // Save customer to MongoDB

            const response =
                await fetch(
                    "/api/customers/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            phone: phone
                        })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                showMessage(
                    data.message ||
                    "Account creation failed.",
                    "error"
                );

                return;

            }


            localStorage.setItem(
                "customerPhone",
                phone
            );


            localStorage.setItem(
                "firebaseUid",
                user.uid
            );


            showMessage(
                "🎉 Account created successfully!",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "my-services.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Invalid OTP or account creation failed.",
                "error"
            );

        }

    };


    // =========================
    // TIMER
    // =========================

    function startTimer(elementId) {

        let seconds = 30;

        const element =
            document.getElementById(elementId);


        const interval =
            setInterval(() => {

                element.textContent =
                    "You can request another OTP after " +
                    seconds +
                    " seconds.";

                seconds--;


                if (seconds < 0) {

                    clearInterval(interval);

                    element.textContent =
                        "You can request OTP again.";

                }

            }, 1000);

    }

</script>

</body>

</html>
